<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hanline — 中文最优断行</title>
<style>
  :root {
    --ink: #18181b;
    --ink-2: #52525b;
    --ink-3: #a1a1aa;
    --rule: #e4e4e7;
    --paper: #fafafa;
    --card: #ffffff;
    --kp: #1d4ed8;
    --gr: #b45309;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.6 -apple-system, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 32px 20px 64px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13px; }
  .panel {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  textarea {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    font: inherit;
    line-height: 1.6;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 10px 12px;
  }
  textarea:focus { outline: 2px solid var(--kp); outline-offset: -1px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: center;
    margin-top: 12px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .controls label { display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 200px; accent-color: var(--kp); }
  .val { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 52px; display: inline-block; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .col {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .col-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--rule);
  }
  .col-title { font-weight: 620; font-size: 14px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .kp .dot { background: var(--kp); }
  .gr .dot { background: var(--gr); }
  .col-note { font-size: 12px; color: var(--ink-3); }
  canvas { display: block; width: 100%; }
  .metrics {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1px; background: var(--rule);
    border-top: 1px solid var(--rule);
  }
  .metrics div { background: var(--card); padding: 10px 14px; }
  .metrics .k { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
  .metrics .v { font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .metrics .v.bad { color: var(--gr); }
  .legend { margin-top: 16px; font-size: 12px; color: var(--ink-2); line-height: 1.8; }
  .legend code { background: #f4f4f5; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
  .swatch { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--kp); vertical-align: middle; margin-right: 6px; }
  .swatch.g { border-top-style: dashed; border-top-color: var(--gr); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>hanline — 中文最优断行</h1>
    <div class="sub">同一份 box/glue/penalty 节点，两种断点选择策略。左：Knuth-Plass 全局最优；右：greedy 逐字累加。</div>
  </header>

  <div class="panel">
    <textarea id="text" spellcheck="false"></textarea>
    <div class="controls">
      <label>行宽 <input type="range" id="width" min="8" max="40" step="0.5" value="24"><span class="val" id="widthVal">24.0 em</span></label>
      <label>字号 <input type="range" id="em" min="11" max="22" step="1" value="16"><span class="val" id="emVal">16 px</span></label>
      <label><input type="checkbox" id="squeeze" checked> 标点挤压</label>
    </div>
  </div>

  <div class="cols">
    <section class="col kp">
      <div class="col-head">
        <span class="col-title"><span class="dot"></span>Knuth-Plass</span>
        <span class="col-note" id="kpNote"></span>
      </div>
      <canvas id="kp"></canvas>
      <div class="metrics" id="kpMetrics"></div>
    </section>
    <section class="col gr">
      <div class="col-head">
        <span class="col-title"><span class="dot"></span>greedy</span>
        <span class="col-note" id="grNote"></span>
      </div>
      <canvas id="gr"></canvas>
      <div class="metrics" id="grMetrics"></div>
    </section>
  </div>

  <div class="legend">
    <span class="swatch"></span>实线 = 被拉伸（ratio &gt; 0）　
    <span class="swatch g"></span>虚线 = 被压缩（ratio &lt; 0）　
    每行左侧标出行号与该行的 ratio。虚线为行宽边界。<br>
    指标：<code>badness</code> = Σ 100·|ratio|³（TeX 定义，越小越好）；
    <code>worst</code> = 最差行的 |ratio|；
    <code>lastFill</code> = 末行内容占行宽比例；
    <code>kinsoku</code> = 行首/行尾禁则违反次数（应为 0）。
  </div>
</div>

<script>
/*__ENGINE__*/
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
